<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Procesos – Reclutamiento</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #f0f4f8; }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    /* ── Stats ── */
    .crm-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .crm-stat {
      background: #fff;
      border-radius: 10px;
      padding: 14px 18px;
      text-align: center;
      flex: 1;
      min-width: 80px;
      box-shadow: 0 2px 8px rgba(0,72,146,.07);
    }
    .crm-stat .num {
      font-size: 24px;
      font-weight: 800;
      color: #004892;
      line-height: 1;
    }
    .crm-stat .lbl {
      font-size: 10px;
      color: #8a9ab0;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-top: 4px;
    }

    /* ── Filters ── */
    .crm-filters {
      background: #fff;
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,72,146,.06);
    }
    .crm-filters .fi {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 150px;
      flex: 1;
    }
    .crm-filters label {
      font-size: 10px;
      font-weight: 700;
      color: #004892;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .crm-filters input,
    .crm-filters select {
      padding: 8px 10px;
      border: 1px solid #c8d4e3;
      border-radius: 6px;
      font-size: 13px;
      background: #f8fafc;
      color: #1a2a3a;
      width: 100%;
      box-sizing: border-box;
    }
    .crm-filters input:focus,
    .crm-filters select:focus {
      outline: none;
      border-color: #004892;
      box-shadow: 0 0 0 3px rgba(0,72,146,.12);
    }
    .btn-clear {
      padding: 8px 16px;
      background: #fff;
      border: 1.5px solid #004892;
      color: #004892;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
      align-self: flex-end;
    }
    .btn-clear:hover { background: #004892; color: #fff; }

    /* ── Meta ── */
    .crm-meta { font-size: 12px; color: #8a9ab0; margin-bottom: 10px; }

    /* ── Player list ── */
    #crm-list { display: flex; flex-direction: column; gap: 8px; }

    .crm-row {
      background: #fff;
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,72,146,.05);
      transition: box-shadow .15s;
      flex-wrap: wrap;
    }
    .crm-row:hover { box-shadow: 0 4px 16px rgba(0,72,146,.11); }

    /* Name + position + stars */
    .crm-player { flex: 2; min-width: 150px; }
    .crm-player strong { display: block; font-size: 15px; color: #1a2a3a; }
    .crm-player .crm-sub { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #8a9ab0; margin-top: 3px; }
    .crm-stars { color: #c8a200; letter-spacing: 1px; }
    .crm-pos {
      font-size: 11px;
      font-weight: 800;
      background: rgba(0,72,146,.10);
      color: #004892;
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: .3px;
    }

    /* Stage select */
    .crm-stage-wrap { flex: 2; min-width: 155px; }
    .crm-stage-wrap .field-lbl {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: #8a9ab0;
      margin-bottom: 3px;
    }
    .crm-stage-wrap select {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #c8d4e3;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      background: #f8fafc;
      color: #1a2a3a;
      cursor: pointer;
    }
    .crm-stage-wrap select:focus { outline: none; border-color: #004892; }

    /* Priority badge */
    .crm-priority { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .crm-priority .field-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: #8a9ab0;
    }
    .badge-pri {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
    }
    .badge-pri.A { background: rgba(0,72,146,.12); color: #004892; }
    .badge-pri.B { background: rgba(0,0,0,.07);   color: #444; }
    .badge-pri.C { background: rgba(139,0,0,.10); color: #8B0000; }

    /* Progress */
    .crm-progress { flex: 1; min-width: 90px; }
    .crm-progress .field-lbl {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: #8a9ab0;
      margin-bottom: 4px;
    }
    .crm-bar { height: 7px; background: #e8eef5; border-radius: 999px; overflow: hidden; }
    .crm-bar-fill { height: 100%; background: #004892; border-radius: 999px; }
    .crm-pct { font-size: 11px; color: #8a9ab0; margin-top: 3px; }

    /* Next step */
    .crm-next { flex: 2; min-width: 130px; }
    .crm-next .field-lbl {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: #8a9ab0;
      margin-bottom: 3px;
    }
    .crm-next span { font-size: 12px; color: #3a4a5a; }

    /* Actions */
    .crm-actions { display: flex; gap: 6px; align-items: center; }
    .btn-perfil {
      padding: 8px 14px;
      background: #004892;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: background .15s;
    }
    .btn-perfil:hover { background: #003570; color: #fff; }

    .btn-expand {
      padding: 8px 10px;
      background: #f0f4f8;
      color: #004892;
      border: 1px solid #c8d4e3;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      line-height: 1;
      transition: background .15s;
    }
    .btn-expand:hover { background: #dde8f5; }
    .btn-expand.open { background: #004892; color: #fff; border-color: #004892; }

    .btn-reset {
      padding: 8px 10px;
      background: #fff;
      color: #8B0000;
      border: 1px solid rgba(139,0,0,.3);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, color .15s;
    }
    .btn-reset:hover { background: #8B0000; color: #fff; border-color: #8B0000; }
    .btn-remove {
      padding: 5px 10px;
      background: #fff;
      color: #c0392b;
      border: 1px solid #e0b0b0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .btn-remove:hover { background: #c0392b; color: #fff; border-color: #c0392b; }

    /* Expand panel */
    .crm-expand {
      display: none;
      border-top: 1px solid #e8eef5;
      margin-top: 12px;
      padding-top: 14px;
      width: 100%;
      gap: 16px;
      flex-wrap: wrap;
    }
    .crm-expand.open { display: flex; }

    .expand-block {
      flex: 1;
      min-width: 220px;
    }
    .expand-block .expand-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: #004892;
      margin-bottom: 6px;
      display: block;
    }
    .expand-block .expand-text {
      font-size: 13px;
      color: #3a4a5a;
      line-height: 1.6;
      white-space: pre-wrap;
      background: #f8fafc;
      border: 1px solid #e0e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 60px;
    }
    .expand-block .expand-empty {
      font-size: 12px;
      color: #b0bec8;
      font-style: italic;
    }

    .expand-checklist {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chk-item {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #c8d4e3;
      background: #f0f4f8;
      color: #8a9ab0;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .chk-item.done {
      background: rgba(0,72,146,.1);
      border-color: rgba(0,72,146,.25);
      color: #004892;
    }

    /* Drag & drop */
    .drag-handle {
      cursor: grab;
      color: #c0ccd8;
      font-size: 18px;
      padding: 0 10px 0 2px;
      user-select: none;
      flex-shrink: 0;
      line-height: 1;
      align-self: center;
    }
    .drag-handle:active { cursor: grabbing; }
    .crm-row.dragging { opacity: .45; }
    .crm-row.drag-over { box-shadow: 0 -3px 0 0 #004892, 0 4px 18px rgba(0,72,146,.12); }

    /* Empty state */
    .crm-empty {
      text-align: center;
      padding: 60px 20px;
      color: #8a9ab0;
      background: #fff;
      border-radius: 12px;
    }
    .crm-empty h3 { color: #004892; margin: 0 0 8px; font-size: 18px; }
    .crm-empty p { font-size: 14px; margin: 0; }

    @media (max-width: 768px) {
      .crm-row { flex-direction: column; align-items: flex-start; }
      .crm-player, .crm-stage-wrap, .crm-next { width: 100%; min-width: 0; }
      .crm-stats .crm-stat .lbl { font-size: 9px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>Reclutamiento</h1>
      <span id="equipo-label" style="font-size:13px;opacity:.75;color:white;flex:1;text-align:center;"></span>
    </div>
    <nav>
      <a href="index.html" class="nav-link">Inicio</a>
      <a href="graficas.html" class="nav-link">Gráficas</a>
      <a href="comparador.html" class="nav-link">Comparador</a>
      <a href="bigboard.html" class="nav-link">Big Board</a>
      <a href="roster.html" class="nav-link">Roster</a>
      <a href="procesos.html" class="nav-link active">Procesos</a>
      <a href="tareas.html" class="nav-link">Tareas</a>
    </nav>
  </header>

  <main>

    <!-- Stats -->
    <div class="crm-stats">
      <div class="crm-stat"><div class="num" id="s-total">0</div><div class="lbl">Total</div></div>
      <div class="crm-stat"><div class="num" id="s-nuevo">0</div><div class="lbl">Nuevo</div></div>
      <div class="crm-stat"><div class="num" id="s-eval">0</div><div class="lbl">Evaluando</div></div>
      <div class="crm-stat"><div class="num" id="s-contactado">0</div><div class="lbl">Contactado</div></div>
      <div class="crm-stat"><div class="num" id="s-interesado">0</div><div class="lbl">Interesado</div></div>
      <div class="crm-stat"><div class="num" id="s-tryout">0</div><div class="lbl">Tryout</div></div>
      <div class="crm-stat"><div class="num" id="s-oferta">0</div><div class="lbl">Oferta</div></div>
      <div class="crm-stat"><div class="num" id="s-admitido">0</div><div class="lbl">Admitido</div></div>
    </div>

    <!-- Filters -->
    <div class="crm-filters">
      <div class="fi">
        <label>Buscar</label>
        <input id="crm-search" type="text" placeholder="Nombre del prospecto...">
      </div>
      <div class="fi">
        <label>Etapa</label>
        <select id="crm-stage-filter">
          <option value="">Todas</option>
          <option>Nuevo</option>
          <option>Evaluando</option>
          <option>Contactado</option>
          <option>Interesado</option>
          <option>Tryout / Visita</option>
          <option>Oferta</option>
          <option>Admitido</option>
          <option>No interesado</option>
        </select>
      </div>
      <div class="fi">
        <label>Prioridad</label>
        <select id="crm-priority-filter">
          <option value="">Todas</option>
          <option>A</option>
          <option>B</option>
          <option>C</option>
        </select>
      </div>
      <button class="btn-clear" id="crm-clear">✕ Limpiar</button>
    </div>

    <div class="crm-meta" id="crm-meta"></div>

    <div id="crm-list"></div>

  </main>

  <footer>
    <p>&copy; 2025 Reclutamiento MTY — Uso interno</p>
  </footer>

  <script>
  (function(){
    "use strict";

    const STAGES = ["Nuevo","Evaluando","Contactado","Interesado","Tryout / Visita","Oferta","Admitido","No interesado"];
    const CHECK_KEYS = ["contacto","evaluado","academico","combine","tryout","decision"];

    function getUser(){ return localStorage.getItem("usuarioActual") || ""; }

    function getIndex(u){
      try { return JSON.parse(localStorage.getItem(`procesos_${u}`) || "[]"); }
      catch { return []; }
    }

    function loadProceso(key){
      try { return JSON.parse(localStorage.getItem(`proceso_${key}`) || "null"); }
      catch { return null; }
    }

    function saveProceso(key, data){
      localStorage.setItem(`proceso_${key}`, JSON.stringify({ ...data, lastUpdated: new Date().toISOString() }));
    }

    function getRating(u, nombre, apellido){
      try {
        const c = JSON.parse(localStorage.getItem(`calificaciones_${u}`) || "{}");
        return c[`${u}_${nombre}_${apellido}`] || 0;
      } catch { return 0; }
    }

    function stars(n){
      const f = Math.min(5, Math.max(0, Math.round(n)));
      return `<span class="crm-stars">${"★".repeat(f)}${"☆".repeat(5-f)}</span>`;
    }

    function prog(p){
      const c = p?.checklist || {};
      const done = CHECK_KEYS.filter(k => c[k]).length;
      return { done, total: CHECK_KEYS.length, pct: Math.round((done / CHECK_KEYS.length) * 100) };
    }

    function parseKey(key){
      const parts = (key || "").split("_");
      return parts.length < 3
        ? { nombre: key, apellido: "" }
        : { nombre: parts[1] || "", apellido: parts.slice(2).join(" ") };
    }

    function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    const CHECK_LABELS = {
      contacto: "Contacto", evaluado: "Evaluado", academico: "Académico",
      combine: "Combine", tryout: "Tryout", decision: "Decisión"
    };

    function getNotaLibre(u, nombre, apellido){
      try { return localStorage.getItem(`${u}_${nombre}_${apellido}`) || ""; }
      catch { return ""; }
    }

    function getOrder(u){
      try { return JSON.parse(localStorage.getItem(`procesos_order_${u}`)) || null; }
      catch { return null; }
    }
    function saveOrder(u, keys){
      localStorage.setItem(`procesos_order_${u}`, JSON.stringify(keys));
    }

    function loadCards(){
      const u = getUser();
      return getIndex(u).map(key => {
        const p = loadProceso(key);
        if (!p) return null;
        const nm = parseKey(key);
        const pr = prog(p);
        return {
          key,
          nombre: nm.nombre,
          apellido: nm.apellido,
          stage: STAGES.includes(p.stage) ? p.stage : "Nuevo",
          priority: (p.priority || "B").toUpperCase(),
          nextStep: p.nextStep || "",
          position: p.position || "",
          pr,
          rating: getRating(u, nm.nombre, nm.apellido),
          // scouting report data
          notes: p.notes || "",
          decisionDetails: p.decision?.details || "",
          decisionStatus: p.decision?.status || "",
          checklist: p.checklist || {},
          notaLibre: getNotaLibre(u, nm.nombre, nm.apellido),
          search: `${nm.nombre} ${nm.apellido} ${p.nextStep||""} ${p.notes||""}`.toLowerCase()
        };
      }).filter(Boolean);
    }

    function updateStats(cards){
      const ct = {};
      STAGES.forEach(s => ct[s] = 0);
      cards.forEach(c => { if (ct[c.stage] !== undefined) ct[c.stage]++; });
      document.getElementById("s-total").textContent = cards.length;
      document.getElementById("s-nuevo").textContent = ct["Nuevo"];
      document.getElementById("s-eval").textContent = ct["Evaluando"];
      document.getElementById("s-contactado").textContent = ct["Contactado"];
      document.getElementById("s-interesado").textContent = ct["Interesado"];
      document.getElementById("s-tryout").textContent = ct["Tryout / Visita"];
      document.getElementById("s-oferta").textContent = ct["Oferta"];
      document.getElementById("s-admitido").textContent = ct["Admitido"];
    }

    function buildRow(card){
      const row = document.createElement("div");
      row.className = "crm-row";
      row.setAttribute("draggable", "true");
      row.dataset.key = card.key;

      const stageOpts = STAGES.map(s =>
        `<option${s === card.stage ? " selected" : ""}>${esc(s)}</option>`
      ).join("");

      row.innerHTML = `
        <span class="drag-handle" title="Arrastrar para reordenar">⠿</span>
        <div class="crm-player">
          <strong>${esc(card.nombre)} ${esc(card.apellido)}</strong>
          <div class="crm-sub">
            ${stars(card.rating)}
            ${card.position ? `<span class="crm-pos">${esc(card.position)}</span>` : ""}
          </div>
        </div>

        <div class="crm-stage-wrap">
          <span class="field-lbl">Etapa</span>
          <select class="js-stage">${stageOpts}</select>
        </div>

        <div class="crm-priority">
          <span class="field-lbl">Prior.</span>
          <div class="badge-pri ${card.priority}">${card.priority}</div>
        </div>

        <div class="crm-progress">
          <span class="field-lbl">Checklist</span>
          <div class="crm-bar">
            <div class="crm-bar-fill" style="width:${card.pr.pct}%"></div>
          </div>
          <div class="crm-pct">${card.pr.done}/${card.pr.total}</div>
        </div>

        <div class="crm-next">
          <span class="field-lbl">Próximo paso</span>
          <span>${card.nextStep ? esc(card.nextStep) : '<em style="color:#bbb">—</em>'}</span>
        </div>

        <div class="crm-actions">
          <a class="btn-perfil"
             href="perfil.html?nombre=${encodeURIComponent(card.nombre)}&apellido=${encodeURIComponent(card.apellido)}">
            Ver perfil
          </a>
          <button class="btn-expand js-expand" title="Ver scouting report">▼</button>
          <button class="btn-reset js-reset" title="Reiniciar proceso">↺</button>
          <button class="btn-remove js-remove" title="Eliminar del seguimiento">✕</button>
        </div>

        <div class="crm-expand js-expand-panel">

          <div class="expand-block">
            <span class="expand-lbl">Checklist</span>
            <div class="expand-checklist">
              ${CHECK_KEYS.map(k => `
                <span class="chk-item${card.checklist[k] ? " done" : ""}">
                  ${card.checklist[k] ? "✓" : "○"} ${CHECK_LABELS[k]}
                </span>`).join("")}
            </div>
          </div>

          <div class="expand-block">
            <span class="expand-lbl">Notas del proceso</span>
            ${card.notes
              ? `<div class="expand-text">${esc(card.notes)}</div>`
              : `<div class="expand-empty">Sin notas registradas.</div>`}
          </div>

          <div class="expand-block">
            <span class="expand-lbl">Detalles</span>
            ${card.decisionDetails
              ? `<div class="expand-text">${esc(card.decisionDetails)}</div>`
              : `<div class="expand-empty">Sin detalles registrados.</div>`}
          </div>

          <div class="expand-block">
            <span class="expand-lbl">Scouting Report</span>
            ${card.notaLibre
              ? `<div class="expand-text">${esc(card.notaLibre)}</div>`
              : `<div class="expand-empty">Sin reporte</div>`}
          </div>

        </div>
      `;

      row.querySelector(".js-stage").addEventListener("change", function(){
        const p = loadProceso(card.key);
        if (!p) return;
        p.stage = this.value;
        saveProceso(card.key, p);
        render();
      });

      // Expand toggle
      const expandBtn = row.querySelector(".js-expand");
      const expandPanel = row.querySelector(".js-expand-panel");
      expandBtn.addEventListener("click", () => {
        const open = expandPanel.classList.toggle("open");
        expandBtn.classList.toggle("open", open);
        expandBtn.textContent = open ? "▲" : "▼";
      });

      // Reset proceso
      row.querySelector(".js-reset").addEventListener("click", () => {
        const ok = confirm(`¿Reiniciar todo el proceso de ${card.nombre} ${card.apellido}?\n\nEsto borrará etapa, checklist, notas y decisión. No se puede deshacer.`);
        if (!ok) return;
        const p = loadProceso(card.key) || {};
        const reset = {
          stage: "Nuevo",
          priority: p.priority || "B",
          position: p.position || "",
          checklist: {},
          notes: "",
          nextStep: "",
          decision: { status: "pendiente", details: "" },
        };
        saveProceso(card.key, reset);
        render();
      });

      // Remove from procesos
      row.querySelector(".js-remove").addEventListener("click", () => {
        const ok = confirm(`¿Eliminar a ${card.nombre} ${card.apellido} del seguimiento?\n\nSe quitará de Procesos pero su perfil y datos no se borrarán.`);
        if (!ok) return;
        const u = getUser();
        const idx = getIndex(u).filter(k => k !== card.key);
        localStorage.setItem(`procesos_${u}`, JSON.stringify(idx));
        const ord = getOrder(u);
        if (ord) saveOrder(u, ord.filter(k => k !== card.key));
        render();
      });

      return row;
    }

    function render(){
      const q  = document.getElementById("crm-search").value.toLowerCase().trim();
      const sf = document.getElementById("crm-stage-filter").value;
      const pf = document.getElementById("crm-priority-filter").value;

      const all = loadCards();
      const saved = getOrder(getUser());
      if (saved) {
        all.sort((a, b) => {
          const ia = saved.indexOf(a.key);
          const ib = saved.indexOf(b.key);
          return (ia === -1 ? 9999 : ia) - (ib === -1 ? 9999 : ib);
        });
      }
      updateStats(all);

      const filtered = all.filter(c =>
        (!q  || c.search.includes(q)) &&
        (!sf || c.stage === sf) &&
        (!pf || c.priority === pf)
      );

      const list = document.getElementById("crm-list");
      const meta = document.getElementById("crm-meta");
      list.innerHTML = "";

      meta.textContent = filtered.length === all.length
        ? `${all.length} jugador${all.length !== 1 ? "es" : ""} en seguimiento`
        : `${filtered.length} de ${all.length} jugadores`;

      if (filtered.length === 0){
        list.innerHTML = `
          <div class="crm-empty">
            <h3>Sin jugadores en seguimiento</h3>
            <p>Abre el perfil de un prospecto y activa su proceso desde la sección CRM del perfil para verlo aquí.</p>
          </div>`;
        return;
      }

      filtered.forEach(c => list.appendChild(buildRow(c)));
    }

    document.addEventListener("DOMContentLoaded", () => {
      const u = getUser();
      const lbl = document.getElementById("equipo-label");
      if (lbl && u) lbl.textContent = u;

      render();

      document.getElementById("crm-search").addEventListener("input", render);
      document.getElementById("crm-stage-filter").addEventListener("change", render);
      document.getElementById("crm-priority-filter").addEventListener("change", render);
      document.getElementById("crm-clear").addEventListener("click", () => {
        document.getElementById("crm-search").value = "";
        document.getElementById("crm-stage-filter").value = "";
        document.getElementById("crm-priority-filter").value = "";
        render();
      });

      // ── Drag & drop to reorder ──
      const list = document.getElementById("crm-list");
      let dragSrcKey = null;

      list.addEventListener("dragstart", e => {
        const row = e.target.closest(".crm-row");
        if (!row) return;
        dragSrcKey = row.dataset.key;
        row.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });

      list.addEventListener("dragover", e => {
        e.preventDefault();
        const row = e.target.closest(".crm-row");
        if (!row || row.dataset.key === dragSrcKey) return;
        e.dataTransfer.dropEffect = "move";
        list.querySelectorAll(".crm-row.drag-over").forEach(r => r.classList.remove("drag-over"));
        row.classList.add("drag-over");
      });

      list.addEventListener("dragleave", e => {
        if (!list.contains(e.relatedTarget)) {
          list.querySelectorAll(".crm-row.drag-over").forEach(r => r.classList.remove("drag-over"));
        }
      });

      list.addEventListener("drop", e => {
        e.preventDefault();
        const targetRow = e.target.closest(".crm-row");
        if (!targetRow || targetRow.dataset.key === dragSrcKey) return;
        targetRow.classList.remove("drag-over");

        const srcRow = list.querySelector(`[data-key="${dragSrcKey}"]`);
        if (!srcRow) return;

        const allRows = [...list.querySelectorAll(".crm-row")];
        const srcIdx = allRows.indexOf(srcRow);
        const dstIdx = allRows.indexOf(targetRow);
        list.insertBefore(srcRow, srcIdx < dstIdx ? targetRow.nextSibling : targetRow);

        const newOrder = [...list.querySelectorAll(".crm-row")].map(r => r.dataset.key);
        saveOrder(getUser(), newOrder);
      });

      list.addEventListener("dragend", () => {
        list.querySelectorAll(".crm-row.dragging, .crm-row.drag-over")
          .forEach(r => r.classList.remove("dragging", "drag-over"));
        dragSrcKey = null;
      });
    });

  })();
  </script>

</body>
</html>
